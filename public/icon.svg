<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="#27272a" stroke-width="8" />

  <!-- Abstract Prompt Lines and Speech Wave (Theme: Speak and Rhythm) -->
  <g transform="translate(106, 126)">
    <!-- First Line (Prompter layout style) -->
    <rect x="20" y="20" width="180" height="24" rx="12" fill="#71717a" opacity="0.5" />
    <circle cx="230" cy="32" r="12" fill="#71717a" opacity="0.5" />
    
    <!-- Active Highlight Word (Rhythm / Prompter Focus) -->
    <rect x="20" y="80" width="120" height="32" rx="16" fill="url(#accent-grad)" filter="url(#glow)" />
    <rect x="160" y="84" width="120" height="24" rx="12" fill="#e4e4e7" opacity="0.9" />

    <!-- Third Line -->
    <rect x="20" y="144" width="220" height="24" rx="12" fill="#71717a" opacity="0.5" />

    <!-- Speach Flow waves at the bottom -->
    <path d="M20 220 C 60 190, 100 250, 140 220 C 180 190, 220 250, 260 220" fill="none" stroke="url(#accent-grad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
    <path d="M20 220 C 60 205, 100 235, 140 220 C 180 205, 220 235, 260 220" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="16 24" opacity="0.3" />
</svg>
